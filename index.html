<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ann — AI Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f1a; color: #eaeaea;
    display: flex; flex-direction: column;
    height: 100vh; max-width: 800px; margin: 0 auto;
  }
  header {
    padding: 16px 20px; background: #1a1a2e;
    border-bottom: 1px solid #2a2a40;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
  }
  header h1 { font-size: 18px; }
  header p { font-size: 12px; color: #888; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 80%; padding: 12px 16px; border-radius: 16px;
    line-height: 1.5; font-size: 15px; white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end; background: #6c5ce7; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ann {
    align-self: flex-start; background: #1e1e30;
    border: 1px solid #2a2a40; border-bottom-left-radius: 4px;
  }
  .typing { color: #888; font-style: italic; }
  #input-area {
    padding: 16px; background: #1a1a2e;
    border-top: 1px solid #2a2a40;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1; padding: 14px; border-radius: 12px;
    border: 1px solid #2a2a40; background: #0f0f1a;
    color: #eaeaea; font-size: 15px; resize: none;
    font-family: inherit; max-height: 120px;
  }
  #input:focus { outline: none; border-color: #6c5ce7; }
  button {
    padding: 0 20px; border-radius: 12px; border: none;
    background: #6c5ce7; color: #fff; font-weight: 600;
    cursor: pointer; font-size: 15px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .setup {
    padding: 20px; background: #1e1e30; margin: 20px;
    border-radius: 12px; border: 1px solid #6c5ce7;
  }
  .setup input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px;
    border: 1px solid #2a2a40; background: #0f0f1a; color: #eaeaea; }
  .setup button { padding: 10px 20px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="avatar">A</div>
  <div>
    <h1>Ann</h1>
    <p>Your AI assistant</p>
  </div>
</header>

<div id="setupBox" class="setup">
  <strong>First-time setup:</strong> paste your free Google Gemini API key.
  <br><a href="https://aistudio.google.com/apikey" target="_blank" style="color:#a29bfe">Get a key here (free)</a>
  <input id="apiKeyInput" type="password" placeholder="AIza...">
  <button onclick="saveKey()">Save & Start</button>
</div>

<div id="chat" style="display:none"></div>

<div id="input-area" style="display:none">
  <textarea id="input" rows="1" placeholder="Message Ann..."></textarea>
  <button id="sendBtn" onclick="send()">Send</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let API_KEY = localStorage.getItem('ann_api_key') || '';
const SYSTEM_PROMPT = "You are Ann, a friendly, helpful, and concise AI assistant. Answer clearly and naturally. You can help with schoolwork, coding, everyday questions, and general knowledge.";
let history = [];

// Init
if (API_KEY) {
  document.getElementById('setupBox').style.display = 'none';
  chatEl.style.display = 'flex';
  document.getElementById('input-area').style.display = 'flex';
  addMsg("Hi! I'm Ann. How can I help you today?", 'ann');
}

function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k) return alert('Please paste your API key.');
  localStorage.setItem('ann_api_key', k);
  API_KEY = k;
  location.reload();
}

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMsg(text, 'user');
  history.push({ role: 'user', parts: [{ text }] });

  const typing = addMsg('Ann is typing...', 'ann');
  typing.classList.add('typing');
  sendBtn.disabled = true;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: history
        })
      }
    );
    const data = await res.json();
    typing.remove();

    if (data.error) {
      addMsg('Error: ' + data.error.message, 'ann');
      history.pop();
    } else {
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I didn't get a response.";
      addMsg(reply, 'ann');
      history.push({ role: 'model', parts: [{ text: reply }] });
    }
  } catch (e) {
    typing.remove();
    addMsg('Network error: ' + e.message, 'ann');
    history.pop();
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

// Enter to send (Shift+Enter = newline)
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
