<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anish AI — Deep Reasoning &amp; Multimodal Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f9f6f0;
      --surface: #f4efe6;
      --surface-high: #ebe4d7;
      --ink: #1e1b18;
      --muted: #5c554c;
      --primary: #c85a32;
      --primary-container: #f6ddd3;
      --primary-on-container: #5a210d;
      --secondary: #4e6e58;
      --secondary-container: #d9e6dc;
      --secondary-on-container: #1b3423;
      --outline: #e4ddd0;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    [data-theme="dark"] {
      --bg: #161412;
      --surface: #1f1c19;
      --surface-high: #2d2823;
      --ink: #f2ede4;
      --muted: #b9b0a2;
      --primary: #e87a52;
      --primary-container: #5e2815;
      --primary-on-container: #ffdbd0;
      --secondary: #88b396;
      --secondary-container: #263e2e;
      --secondary-on-container: #d6ede0;
      --outline: #39332d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 85% 10%, rgba(200, 90, 50, 0.1), transparent 45%),
        radial-gradient(circle at 12% 88%, rgba(78, 110, 88, 0.1), transparent 45%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid var(--outline);
    }

    .nav {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: 18px;
    }

    .brand h1 {
      font-family: "Fraunces", serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-container);
      color: var(--primary-on-container);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--outline);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      min-height: 40px;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    button:hover {
      border-color: var(--primary);
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome {
      text-align: center;
      padding: 24px 12px 8px;
    }

    .welcome h2 {
      font-family: "Fraunces", serif;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 600;
      line-height: 1.18;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 15px;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .starters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .starter-card {
      text-align: left;
      border-radius: var(--radius-md);
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--outline);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: auto;
    }

    .starter-card strong {
      font-size: 14px;
      color: var(--ink);
    }

    .starter-card span {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      font-weight: 400;
    }

    .thread {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .msg-user {
      align-self: flex-end;
      max-width: 82%;
      background: var(--primary-container);
      color: var(--primary-on-container);
      padding: 12px 16px;
      border-radius: 20px 20px 6px 20px;
      font-size: 15px;
      line-height: 1.5;
    }

    .msg-assistant-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .think-card {
      background: var(--surface-high);
      border: 1px solid var(--outline);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .think-toggle {
      width: 100%;
      border: none;
      background: transparent;
      border-radius: 0;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--ink);
    }

    .think-body {
      padding: 0 14px 12px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
      font-style: italic;
    }

    .think-body.hidden {
      display: none;
    }

    .msg-assistant {
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font-size: 15px;
      line-height: 1.65;
    }

    .code-block {
      margin-top: 12px;
      background: var(--surface-high);
      border: 1px solid var(--outline);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid var(--outline);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .code-header button {
      min-height: 28px;
      padding: 4px 10px;
      font-size: 11px;
    }

    pre {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
      padding: 12px;
      overflow-x: auto;
    }

    .composer {
      position: sticky;
      bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(30, 27, 24, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      min-height: 44px;
      max-height: 140px;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .mode-chip.active {
      background: var(--primary-container);
      color: var(--primary-on-container);
      border-color: var(--primary);
    }

    footer {
      text-align: center;
      padding: 12px 20px 24px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">
        <div class="brand-mark">A</div>
        <h1>Anish AI</h1>
        <span class="badge" id="modeBadge">DeepThink</span>
      </div>
      <div class="actions">
        <button type="button" id="newChatBtn">New Chat</button>
        <button type="button" id="themeBtn" aria-label="Toggle theme">Umber</button>
      </div>
    </div>
  </header>

  <main>
    <section class="welcome" id="welcomeSection">
      <h2>How can I help you think today?</h2>
      <p>
        Switch between <strong>Fast</strong> for instant answers or <strong>DeepThink</strong> for
        structured step-by-step reasoning, code generation, and multimodal clarity.
      </p>
    </section>

    <section class="starters" id="starterGrid">
      <button class="starter-card" type="button" data-mode="deep" data-prompt="Compare Kotlin StateFlow vs SharedFlow with clean Android Compose examples.">
        <strong>Debug &amp; Architect</strong>
        <span>Compare Kotlin StateFlow vs SharedFlow with practical Compose patterns.</span>
      </button>
      <button class="starter-card" type="button" data-mode="deep" data-prompt="A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. Why is the ball $0.05?">
        <strong>Reason Step by Step</strong>
        <span>Walk through the classic bat-and-ball puzzle without intuition traps.</span>
      </button>
      <button class="starter-card" type="button" data-mode="fast" data-prompt="Explain how attention works in transformers using a library analogy.">
        <strong>Explain Simply</strong>
        <span>Understand transformer attention using a clear everyday analogy.</span>
      </button>
    </section>

    <section class="thread" id="chatThread" aria-live="polite"></section>

    <form class="composer" id="composerForm">
      <textarea id="promptInput" placeholder="Message Anish AI…" rows="2"></textarea>
      <div class="composer-footer">
        <button type="button" class="mode-chip active" id="deepThinkToggle">
          <span>DeepThink</span>
        </button>
        <button type="submit" class="primary">Send</button>
      </div>
    </form>
  </main>

  <footer>
    Anish AI · Android Companion Preview (Package: com.aistudio.annfocus.krmxvp)
  </footer>

  <script>
    const html = document.documentElement;
    const themeBtn = document.getElementById("themeBtn");
    const deepThinkToggle = document.getElementById("deepThinkToggle");
    const modeBadge = document.getElementById("modeBadge");
    const chatThread = document.getElementById("chatThread");
    const welcomeSection = document.getElementById("welcomeSection");
    const starterGrid = document.getElementById("starterGrid");
    const composerForm = document.getElementById("composerForm");
    const promptInput = document.getElementById("promptInput");
    const newChatBtn = document.getElementById("newChatBtn");

    let deepThink = true;

    themeBtn.addEventListener("click", () => {
      const isDark = html.getAttribute("data-theme") === "dark";
      html.setAttribute("data-theme", isDark ? "light" : "dark");
      themeBtn.textContent = isDark ? "Umber" : "Linen";
    });

    function setMode(isDeep) {
      deepThink = isDeep;
      deepThinkToggle.classList.toggle("active", deepThink);
      modeBadge.textContent = deepThink ? "DeepThink" : "Fast";
    }

    deepThinkToggle.addEventListener("click", () => setMode(!deepThink));

    function appendTurn(promptText) {
      welcomeSection.style.display = "none";
      starterGrid.style.display = "none";

      const userEl = document.createElement("div");
      userEl.className = "msg-user";
      userEl.textContent = promptText;
      chatThread.appendChild(userEl);

      const wrap = document.createElement("div");
      wrap.className = "msg-assistant-wrap";

      if (deepThink) {
        const thinkCard = document.createElement("div");
        thinkCard.className = "think-card";
        thinkCard.innerHTML = `
          <button type="button" class="think-toggle">
            <span>Thought Process</span>
            <span>Toggle</span>
          </button>
          <div class="think-body">
            Breaking down "${promptText.replace(/</g, "&lt;")}" into assumptions, edge cases, and a clear final structure before responding.
          </div>
        `;
        const toggleBtn = thinkCard.querySelector(".think-toggle");
        const thinkBody = thinkCard.querySelector(".think-body");
        toggleBtn.addEventListener("click", () => {
          thinkBody.classList.toggle("hidden");
        });
        wrap.appendChild(thinkCard);
      }

      const reply = document.createElement("div");
      reply.className = "msg-assistant";
      reply.innerHTML = `
        <p>Live AI inference runs in the <strong>Anish AI</strong> Android app via Firebase AI Logic and Cloud Firestore.</p>
        <div class="code-block">
          <div class="code-header">
            <span>kotlin</span>
            <button type="button" class="copy-code-btn">Copy</button>
          </div>
          <pre><code>val model = Firebase.ai.generativeModel("gemini-3.8-flash")</code></pre>
        </div>
      `;
      reply.querySelector(".copy-code-btn").addEventListener("click", (e) => {
        navigator.clipboard?.writeText('val model = Firebase.ai.generativeModel("gemini-3.8-flash")');
        e.target.textContent = "Copied";
        setTimeout(() => { e.target.textContent = "Copy"; }, 1500);
      });

      wrap.appendChild(reply);
      chatThread.appendChild(wrap);
      userEl.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    document.querySelectorAll(".starter-card").forEach((card) => {
      card.addEventListener("click", () => {
        setMode(card.dataset.mode === "deep");
        appendTurn(card.dataset.prompt);
      });
    });

    composerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = "";
      appendTurn(text);
    });

    newChatBtn.addEventListener("click", () => {
      chatThread.innerHTML = "";
      welcomeSection.style.display = "";
      starterGrid.style.display = "";
      promptInput.value = "";
    });
  </script>
</body>
</html>
